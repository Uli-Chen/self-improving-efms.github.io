[project]
name = "self-improving-efms-github-io"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "mediapy>=1.2.6",
    "numpy>=1.26.0,<2.1.0",
    "dm-env>=1.6",
    "moviepy>=2.2.1",
    "torch",
    "torchvision",
    "h5py>=3.10.0",
    "wandb>=0.16.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true